<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Bag • KC's</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app" class="app-container">

  <main class="main-content">

    <div id="bagScreen" class="screen active">

      <button id="backFromBagBtn" class="back-btn"></button>

      <div class="bag-content">
        <h2 class="screen-title">Your Items</h2>

        <div id="cartItemsContainer" class="cart-items"></div>

        <div id="emptyCartMessage" class="empty-cart">
          <p>Don't leave your cup empty!</p>
          <button id="startShoppingBtn" class="secondary-btn">Start Mixing</button>
        </div>

        <div id="cartSummary" class="cart-summary">
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotalAmount">$0.00</span>
          </div>
          <button id="checkoutBtn" class="checkout-btn">
            Proceed to Checkout
          </button>
        </div>

      </div>
    </div>

  </main>
</div>

<script src="script.js"></script>
</body>
</html>
